name: backend-ci

on:
  push:
    paths:
      - "LMS/backend/**"
      - "LMS/frontend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "LMS/backend/**"
      - "LMS/frontend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: LMS/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q .
      - name: Prepare verification report directory
        run: mkdir -p verification-results
      - name: Run backend tests and record expected-versus-actual HTTP assertions
        run: pytest -q -s --junitxml=verification-results/backend-tests.xml
      - name: Evaluate fixed academic queries against known relevant materials
        run: python tests/performance/search_evaluation.py --output verification-results/search-evaluation.json
      - name: Test worker recovery and search scope
        run: pytest -q tests/test_worker.py tests/test_search_evaluation.py
      - name: Measure live Render health endpoint (30 requests, concurrency 3)
        run: python tests/performance/benchmark.py --base-url https://dbms-lms-hwvp.onrender.com --path /health --requests 30 --concurrency 3 --timeout 20 --output verification-results/live-health-benchmark.json
      - name: Measure isolated login latency
        run: python tests/performance/benchmark_login.py
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lms-verification-results-${{ github.run_number }}
          path: LMS/backend/verification-results/*
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LMS/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: LMS/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run accessibility lint
        run: npm run a11y:lint
      - name: Verify frontend product contract
        run: npm run verify:contract
      - name: Build frontend
        env:
          VITE_API_URL: https://dbms-lms-hwvp.onrender.com
        run: npm run build
